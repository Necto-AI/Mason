name: ci

# The compiler and the suite, on every push to main and every pull request. Before this file existed, `main` carried a
# type error in a test and nothing noticed: the suite runs with `--experimental-strip-types`, which erases types without
# reading them, and `tsc` was not a dependency of the project at all.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `vendor/pi` is a submodule pinned to a commit, and every `@earendil-works/*` import — at runtime and through
          # the `paths` map in `tsconfig.json` — resolves into it. Without this nothing typechecks and nothing imports.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same recipe a fresh clone runs (`devenv shell -- setup`): `vendor/pi`'s dependencies and build, the Rust
      # daemon, then the root install. The runner is the one place where cargo has to be there already, and on the
      # GitHub Ubuntu image it is; `vendor/pi/packages/env/daemon/rust-toolchain.toml` names the version.
      - run: bash scripts/setup.sh

      - run: npm run typecheck
      - run: npm run build:web
      - run: npm test
