name: ci

# The compiler and the suite, on every push to main and every pull request. Before this file existed, `main` carried a
# type error in a test and nothing noticed: the suite runs with `--experimental-strip-types`, which erases types without
# reading them, and `tsc` was not a dependency of the project at all.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The same recipe a fresh clone runs (`devenv shell -- setup`): the root install, then the two packages the tests
      # and the runtime import from `dist`. No submodule and no Rust: `@earendil-works/*` are ordinary dependencies and
      # the `pi-env` daemon ships inside its package.
      - run: bash scripts/setup.sh

      - run: npm run lint
      - run: npm run typecheck
      # `docs/SURFACE.md` is rendered from the servers (`scripts/surface.ts`): the doors and what opens each, the
      # extensions a boot installs, and the budgets. A route added without a door fails here, by name, instead of
      # shipping as an endpoint nothing opens.
      - run: npm run gen:surface:check
      # One ceiling per document (`docs/doc-budgets.json`, `docs/AGENTS.md`). A document that grew past its number fails
      # the pull request that grew it, and a ceiling only ever goes down.
      - run: npm run check:docs
      # The same ratchet for code (`docs/code-budgets.json`): one ceiling per area, and it only ever goes down. A cut
      # that shrinks an area is expected to lower its number in the same commit.
      - run: npm run check:code
      - run: npm test
      # The first run as a person walks it: a scratch root, `bin/mason.ts` as separate processes, onboard, a second
      # onboard, a second bot, the fleet refusal, `mason up` in its own process, and one turn over the console socket
      # on `bob`'s home in that root, against a server this script opens because no environment variable scripts the
      # faux provider. `test/onboard.test.ts` spawns the CLI too, but only for the short-lived commands, and
      # `test/chat.test.ts` opens its server in-process: no test starts `mason up` as a process and checks the bot it
      # serves, and the assertion that the run left no home halves at the root it made and wrote no `~/.mason` under
      # its scratch HOME lives only in this script.
      - run: npm run e2e:first-run
        timeout-minutes: 5
      - run: npm run test:packages
      # The packed artifact, installed into an empty project outside the tree: an SDK that only runs from source is not
      # an SDK, and this is the only check that says so.
      - run: npm run prove:connector
