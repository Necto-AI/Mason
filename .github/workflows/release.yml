name: release

# A `v*` tag is the whole release: the checks `ci` runs gate it, then the three packages go out of one commit,
# protocol first because that is the order `build:packages` enforces, with npm provenance and no secret. npm's
# direct-publish tokens stop working in January 2027; this holds nothing but the trusted-publisher entries on
# npmjs.com, configured once per package (package settings, Trusted Publisher: this repository and this workflow
# name). The first smoke tag, and the revocation of the granular `mason-publish` token after it, are human steps on
# the issue's checklist, not steps here.
on:
  push:
    tags:
      - "v*"

# A repushed tag queues behind the run it replaces instead of cancelling a publish mid-flight: half of a release
# is not a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `id-token` mints the provenance statement npm verifies server-side, `contents` writes the GitHub release
      # the tarballs attach to. No secret is configured.
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.4'

      # The tag names the tree: a version pushed on a tree with different manifest versions publishes those
      # numbers, so the mismatch becomes the run's failure instead of a discovery after the publish.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          node -p "require('./package.json').version" | grep -qx "$v"
          node -p "require('./packages/protocol/package.json').version" | grep -qx "$v"
          node -p "require('./packages/connector/package.json').version" | grep -qx "$v"

      # The same recipe a fresh clone runs: the root install, then the two workspace packages the tests and the
      # runtime import from `dist`.
      - run: bash scripts/setup.sh

      # The verify half, verbatim from `ci.yml`: a tag releases only a tree the usual checks pass on.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run gen:surface:check
      - run: npm run check:docs
      - run: npm run check:code
      - run: npm run check:licence
      # The manifests against the tree they describe…
      - run: npm run check:metadata
      - run: npm run test:ci
      # The first run as a person walks it: a scratch root, `bin/mason.ts` as separate processes, flags-only `init` (then
      # again, for the asking-nothing half), `new`, one bot, `mason up` in its own process, and one turn a Chord client
      # answers over the console socket on that bot's home, against a server this script opens because no environment
      # variable scripts the faux provider. `test/mason-bin.test.ts` spawns the CLI too, but only for the short-lived
      # commands, and `test/chat.test.ts` opens its server in-process: no test starts `mason up` as a process and checks
      # the bot it serves, and the assertion that the run left no home halves at the root it made and wrote no `~/.mason`
      # under its scratch HOME lives only in this script.
      - run: npm run e2e:first-run
        timeout-minutes: 5
      - run: npm run test:packages
      # The artifact the release publishes, built here as it is on a pull request: `dist` is what the tarball ships, and
      # the deployment reference is the one copy whose absence is silent.
      - run: npm run build
      - run: test -f dist/docs/agent/README.md
      # …and the tarball as a stranger installs it: packed, unpacked outside the tree, and driven there through `init`
      # from its flags, `new` and a doctor, then asked for its prompt.
      - run: npm run prove:package
      # The packed artifact, installed into an empty project outside the tree: a release that only runs from
      # source is not a release.
      - run: npm run prove:connector

      # The copies to attach land in `.release/`, a directory outside `files`: a tarball dropped into `dist` would ride in
      # the next one packed. Each package's `prepack` runs its build, protocol first, in the order the publish below keeps.
      - run: |
          mkdir .release
          npm pack --workspace mason-protocol --workspace mason-connector --pack-destination .release/
          npm pack --workspaces=false --pack-destination .release/

      # Provenance needs each package.json to name this repository (npm's documented prerequisite), which the three
      # files carry. `--access public` says the visibility outright, because an access default is not a thing to
      # inherit. Publishing is gated on the tag event, so a run on any other ref stops here: verification without
      # a release.
      - name: publish the packages, protocol first
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A version already on the registry is not a failure. The first release of each package goes out by hand,
          # because npm's trusted publishing is configured on a package that already exists; after that a re-run of a
          # tag, or a release where only one of the three moved, must publish what is missing and leave the rest alone.
          publish() {
            name="$1"
            manifest="$2"
            shift 2
            version="$(node -p "require('./${manifest}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on the registry; nothing to publish"
              return 0
            fi
            npm publish "$@" --provenance --access public
          }
          publish mason-protocol packages/protocol --workspace mason-protocol
          publish mason-connector packages/connector --workspace mason-connector
          publish mason-agent . --workspaces=false

      - name: attach the tarballs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are a file, not a summary of the log: the tag is cut by a person who knows what changed, and a
          # generated list of commit subjects cannot state prerequisites, supported platforms or limitations — the three
          # things a stranger needs before `npm install -g`. A version without its file fails here rather than
          # publishing notes that do not describe the release.
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$notes"
          gh release upload "$GITHUB_REF_NAME" .release/mason-*.tgz
