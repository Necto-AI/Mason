name: Bug report
description: Report behavior that does not work as expected.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use a title in the form `area: short outcome` (for example, `connector: reconnect after a timeout`).
        Redact credentials, private URLs, and personal data from all examples and logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable reproduction.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mason version
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node version, and relevant runtime details.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only relevant logs. Remove tokens, keys, private URLs, and personal data.
    validations:
      required: false
