# The optional half of the stack: the Telegram integration and the proxy sidecar it needs.
#
# A separate file and not two more services in `compose.yaml`, because a deployment that does not run Telegram must still
# be able to `up` without editing a tracked file. The first version of this was a commented template somebody uncommented
# in their own checkout, and a deployment is a checkout: the next `git checkout` restored the comments and left these
# containers running with no compose entry behind them — invisible to `down`, skipped by every later `up`, and running
# old code while looking healthy.
#
# It is a file rather than a compose `profile` because the compose provider on this host (podman-compose 1.6.0) drops a
# profiled service from the model even with `--profile` passed and `COMPOSE_PROFILES` set: the service is simply
# missing, which is the same failure with a quieter symptom. Two `-f` arguments merge into one project.
#
# Used by naming it in `deploy/.env`:
#     COMPOSE_EXTRA_FILES=compose.telegram.yaml
#
# `mason-mcp` and `mason-egress` are declared in `compose.yaml` and joined from here; it is one project either way.
services:
  # mason-telegram: the first integration built in this repository (integrations/telegram, its own package and image).
  # Both faces of ADR-0003 in one container: an MCP endpoint mason reaches at http://mason-telegram:8082/mcp, and a long
  # poll that posts one signed event per chat message to POST /api/events/telegram. Uncomment it after minting the secret
  # on the mason side — `docker compose exec mason npm run integration -- add telegram --url http://mason-telegram:8082/mcp
  # --description "The team chat"`, then `secret telegram --hook team-chat`, then paste what it printed once into
  # deploy/.env — and after adding the same four variables there. Nothing here reaches into the home except one directory
  # of it: `mason-inbox`, below, which is a volume of its own rather than a view of `mason-agent`.
  #
  mason-telegram:
    # Built by compose from the package in this repository (`integrations/telegram`), and published on its own release
    # cycle: an integration is not part of mason's image, and a mason upgrade must not require an integration rebuild.
    # `docker build integrations/telegram` produces the same image without the stack around it.
    build:
      context: ../integrations/telegram
    image: ghcr.io/denissud/mason-telegram:latest
    restart: unless-stopped
    environment:
      # The bot's own credential, in this container's environment and nowhere else: not in `service/`, not in an image,
      # never written to the volume.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in deploy/.env}
      # The door, by its compose name. The event path is never proxied, even with HTTPS_PROXY set below.
      MASON_EVENT_URL: http://mason:8787/api/events/telegram
      # Minted by `npm run integration -- secret telegram --hook team-chat`. It buys exactly one verb: one hook fire.
      MASON_TRIGGER_SECRET: ${TELEGRAM_TRIGGER_SECRET:?set TELEGRAM_TRIGGER_SECRET in deploy/.env}
      # The chats this bot may relay, comma-separated ids. A chat that is not here does not become an event, and does
      # not appear in list_chats either.
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:?set TELEGRAM_ALLOWED_CHATS in deploy/.env}
      # Telegram is blocked where this runs, so the API goes through the sidecar below. The container builds an undici
      # ProxyAgent from this (Node 22's fetch does not read it by itself); its README says so.
      HTTPS_PROXY: http://vpn:1080
    networks:
      # In: mason reaches the tools face by name — the `tools.url` in integrations.json. Nothing on mason-internal is
      # here, so a tool cannot reach it.
      - mason-mcp
      # Out: `mason-egress` only, and it is `internal: true`: the one address this container can reach is the proxy
      # below, at http://vpn:1080, and Telegram is reached through it. No direct route to anything else exists. mason
      # shares `mason-edge` with that proxy and could open it — it has egress of its own there, so it changes nothing —
      # while mason-env is on no network that carries the proxy: its own egress is mason-edge, and mason-egress is not
      # one of its networks.
      - mason-egress
    volumes:
      # The offset and the chats it has seen (`offset.json`, `chats.json`) and nothing else. No `mason-service`: the bot
      # token is Telegram's credential, not mason's, and the server's half of the home is not this container's to read.
      - mason-telegram-data:/data
      # The one directory of the agent's home this container sees, and the whole of what it shares with it: a file a
      # message carried is written here, and the event names it by path. `mason-env` mounts the same volume at the same
      # path, so the agent's `read` opens exactly these bytes. Declared in compose.yaml, beside that mount, because the
      # volume is the agent's before it is this container's — and `mason-agent` itself stays absent, which is the boundary:
      # no profile, no log, no skills, no memory repository.
      - mason-inbox:/home/mason/.mason/agent/workspace/inbox
    # No `ports`. The container is reached by name on mason-mcp, and a published port would be a second door into a
    # service that holds a bot token.

  # A proxy sidecar for an integration whose upstream is not reachable from this host (Telegram, here). sing-box with a
  # mixed inbound on 1080 — SOCKS and HTTP on the same port, so either kind of client works — and one outbound, defined
  # in the config file below. Nothing else in the stack uses it.
  #
  # The inbound is exposed on `mason-egress`, which is `internal: true`, and its own way out is `mason-edge`. So the only
  # containers that can see this proxy are the ones whose compose entry joins mason-egress, the proxy keeps the stack's
  # only real route to the internet, and mason and mason-env are not on that network at all.
  #
  vpn:
    # sing-box moves its own (`domain_strategy` out of the outbounds, the resolver keys under `route`, the DNS section
    # rewritten) between minor versions. `latest` would one day refuse a file that was correct yesterday, at whichever
    # boot pulled it. v1.14.4 is what this template's config.example.json is written for.
    image: ghcr.io/sagernet/sing-box:v1.14.4
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      # A real server's address, port, key and password. Copied from ./vpn/config.example.json once, and gitignored: a
      # credential belongs in a file the operator owns, not in the repository and not in an image.
      - ./vpn/config.json:/etc/sing-box/config.json:ro
    networks:
      # Out: mason-edge is this sidecar's own route to the internet, and the only one in the stack.
      - mason-edge
      # In: the proxy's mixed inbound, on a network with no gateway that only the integrations which name the proxy
      # join. mason-mcp is deliberately absent — a proxy is not a capability any integration should be able to offer
      # another. mason and mason-env are absent too, and for the same reason: both already have a route out on
      # mason-edge, so neither needs the proxy, and whatever else the tool machine can reach it cannot reach from here.
      - mason-egress
    # No `ports`, on purpose: a published SOCKS port is an open proxy for anyone who can reach the host.

volumes:
  # The Telegram integration's offset and chat list, and the whole of its state. Losing it costs the poller's place,
  # which on the next boot means "start from now" rather than a replay: nothing here needs backing up, and nothing here
  # is a credential.
  #
  mason-telegram-data:
    name: ${MASON_STACK:-mason}-telegram-data
