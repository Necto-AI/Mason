# mason, two containers: the server, and the machine its tools run on.
#
# `mason` is the repo, the built web client, the agent's home on a volume, the Chord socket and the web UI on 8787,
# published on the host's loopback only. `mason-env` is ubuntu 24.04 and an sshd: the agent's tools were never meant to
# run in the process that thinks, and this is where they run instead. The two are joined by SSH, not by a shared
# process, and mason hands the env container its key on first boot (deploy/mason-entrypoint.sh).
#
# A deployment that reaches a third-party system adds one more container per integration, on the `mason-mcp` network; the
# commented template at the end of `services:` is what a person copies, and service/integrations.json is what tells mason
# where each one is. An integration is not a mason container: another project's image, another project's release cycle.
#
# Build contexts: the mason image is built from the REPOSITORY ROOT (`context: ..`), because the image is the repo —
# its TypeScript run from source, its `vendor/pi` submodule, its built web client. Check the submodule out before
# building: `git submodule update --init --recursive`. The env image is built from this directory alone.
#
# Nothing here terminates TLS. The server is published on 127.0.0.1 and a reverse proxy in front of it is the deployer's
# business; see deploy/README.md for the two headers such a proxy has to preserve.

name: ${MASON_STACK:-mason}

services:
  mason-env:
    build:
      context: .
      dockerfile: env.Dockerfile
      # The same numbers as the mason image: the two containers share the `mason-agent` and `env-keys` volumes, and a
      # volume owned by uid 1000 is not writable by uid 1001.
      args:
        MASON_UID: ${MASON_UID:-1000}
        MASON_GID: ${MASON_GID:-1000}
    image: ${MASON_STACK:-mason}-env:local
    restart: unless-stopped
    environment:
      # The one account sshd allows in (`AllowUsers`); the same name the mason service logs in as.
      MASON_ENV_USER: ${MASON_ENV_USER:-mason}
      # The `gh` credential the tool machine uses, and the only reason this container has a token of its own. `gh` reads
      # `GH_TOKEN` from the environment before it reads any config, so the value lives in `deploy/.env` and here, never
      # in a file a command could rewrite. Absent means no `gh` at all, which is the pre-existing state and not an error.
      GH_TOKEN: ${GH_TOKEN:-}
    # Two networks, and the second one is a decision rather than a default: `mason-out` is an ordinary bridge with a
    # gateway, so this container has a route to the internet, and a tool can `curl`, `gh` and clone. That is what a
    # worker on a repository needs and what a fence against exfiltration forbids — the tool machine can send out what
    # it can read, and it can read the agent's half of the home. The fence is intact for everything that does not need
    # the internet (a deployment that leaves `mason-out` out keeps it); here it is opened on purpose.
    #
    # `mason-out` and not `mason-edge`: both are bridges with a gateway and the address is the same, but a bridge is
    # also a channel, and `mason-edge` carries the proxy sidecar and any integration with a reachable upstream. The tool
    # machine is not something other people's images should be able to open a socket to, so it gets a bridge of its own
    # — one shared with nothing but mason's other outbound-only services — and the fence around `mason-env` means what
    # the comment on mason's networks below says it means.
    networks:
      - mason-internal
      - mason-out
    volumes:
      # Read-only here: mason writes the public half of the key it generated, sshd reads it at login.
      - env-keys:/run/env-keys:ro
      # The agent's half of the home, at the SAME absolute path as in the mason service below: the agent's profile, log,
      # skills, worker definitions and workspace, and the repository its memory is committed to. One path on two
      # machines is what makes a tool's cwd, a `read` and a `git commit` mean the same thing on both.
      #
      # `service/` is deliberately absent: no soul, no token hashes, no connector credential, no database, no SSH
      # key, no provider credential. That absence is the boundary — a mount, not a mode bit that `chmod` can undo.
      - mason-agent:/home/mason/.mason/agent
      # The Telegram integration's inbox, at the path `mason-telegram` writes it to: one volume mounted in two
      # containers at one path, so a file a chat message carried is the file a `read` here opens — an image comes back as
      # an image. It sits inside the `mason-agent` mount above on purpose, and the runtime resolves the longer path first:
      # this directory is the only part of the agent's home that container may write, which is the whole point of the
      # mount being a directory of its own.
      - mason-inbox:/home/mason/.mason/agent/workspace/inbox
      # A checkout the agent works in on behalf of a person, at its host path so that every path in a report, an issue
      # and a prompt means the same thing on the host and in the container. Read-write: the worker commits, branches and
      # pushes. Defaults to the clinical-compass checkout on the deploy host; set REPO_DIR in `deploy/.env` to move it,
      # and leave it pointing at a directory that exists — a bind of a missing path is a container that will not start.
      - ${REPO_DIR:-/home/user/dev/clinical-compass}:${REPO_DIR:-/home/user/dev/clinical-compass}
    # No daemon in the image and none started here: mason uploads `pi-env` over the connection and verifies its SHA-256
    # on the far side before it runs (vendor/pi/packages/env/src/ssh.ts, deployDaemon).

  mason:
    build:
      context: ..
      dockerfile: deploy/mason.Dockerfile
      args:
        MASON_UID: ${MASON_UID:-1000}
        MASON_GID: ${MASON_GID:-1000}
    image: ${MASON_STACK:-mason}:local
    restart: unless-stopped
    depends_on:
      mason-env:
        # Started, not healthy: there is no healthcheck to wait for, and the entrypoint's own wait is what decides
        # whether the env host is answering — it retries, then refuses, with a message naming this container.
        condition: service_started
    networks:
      # Out: the model provider. mason-edge is the network with a gateway, so it is also where the `vpn` sidecar goes out
      # from and where an integration with a reachable upstream joins. mason is the only mason-side member: it gets its own
      # egress here.
      - mason-edge
      # In, on request: the proxy sidecar's mixed inbound, for a host whose direct route to the provider is filtered rather
      # than down (a TLS handshake that stalls after the ClientHello — what a censor looks like from the inside). Joining
      # it grants nothing by itself: the model client uses the proxy only when HTTPS_PROXY is set below, and mason already
      # had a route out on mason-edge, so the membership adds a door beside an open one rather than closing anything.
      - mason-egress
      # In: the env machine. Nothing on mason-edge can reach mason-env.
      - mason-internal
      # In: the integration containers (see the template at the end of this file's services). This is the only member of
      # mason-mcp that is not an integration, and the only one that reaches into it.
      - mason-mcp
    ports:
      # Loopback only, and that is the security boundary: a TLS proxy on the host forwards here, and the port is not
      # reachable from any other machine. The container port stays 8787; MASON_PORT moves the host side.
      - "127.0.0.1:${MASON_PORT:-8787}:8787"
    environment:
      # The home, in its two halves: `agent/` (mounted into mason-env at this same path) and `service/` (only here).
      # A fixed path rather than a variable — a fresh named volume takes the ownership of the directory it is mounted
      # over, and only this path is owned by the agent's uid in the images. Moving it is a rebuild, not an .env change.
      MASON_HOME: /home/mason/.mason
      # 127.0.0.1 inside a container is the container, so the published port would answer nothing. The server binds its
      # own interfaces and the host publishes only loopback.
      HOST: 0.0.0.0
      PORT: "8787"
      # pi's own layout, read from a copy (deploy/mason-entrypoint.sh): the mounted directory is the input, and the copy
      # under $MASON_HOME/pi is what PI_CODING_AGENT_DIR points at. The copy has to be writable — pi takes a lock beside
      # auth.json even to read it.
      MASON_PI_AGENT_SRC: /run/pi-agent
      # The integrations, read from a copy the same way pi's directory is: the mounted file is the operator's input, and
      # the copy under $MASON_HOME/service is what the server reads at boot. One difference — this copy is also what
      # `npm run integration` writes, so the entrypoint leaves it alone when the mount is missing, because an operator
      # who added an integration inside the container did not ask for a restart to delete it.
      MASON_INTEGRATIONS_SRC: /run/integrations.json
      # The bot's own files (`soul.md`, `skills/`), installed into the home on first boot when they are there.
      MASON_BOT_SRC: /run/bot
      # 1: install `soul.md` even when the home already has one — the one boot that replaces a soul on purpose. A home
      # that has ever started has a soul, because the server writes DEFAULT_SOUL into a fresh one, so without this a
      # deployment given a soul months after it started would run the default one forever.
      MASON_BOT_FORCE: ${MASON_BOT_FORCE:-0}
      # The stack this container belongs to, and the volume its env key lands in: the entrypoint names both in the one
      # message an operator reads while a boot is failing, and a name that points at the wrong stack is worse than none.
      MASON_STACK: ${MASON_STACK:-mason}
      MASON_ENV_KEYS_VOLUME: ${MASON_ENV_KEYS_VOLUME:-${MASON_STACK:-mason}-env-keys}
      # 1: refuse to start when there is no provider credential, naming the path. 0: a stack deliberately without a
      # model (the UI loads, no turn can run).
      MASON_MODEL_REQUIRED: ${MASON_MODEL_REQUIRED:-1}
      # Where the tools run. The entrypoint turns these four into the PI_ENV_SSH_* the server reads.
      MASON_ENV_HOST: ${MASON_ENV_HOST:-mason-env}
      MASON_ENV_USER: ${MASON_ENV_USER:-mason}
      MASON_ENV_PORT: ${MASON_ENV_PORT:-22}
      # The name the host key is pinned under in $MASON_HOME/service/ssh/known_hosts; independent of the host and port, which is
      # what makes a re-created env container a re-scan rather than a "host key changed" refusal.
      MASON_ENV_ALIAS: ${MASON_ENV_ALIAS:-pi-env-mason-env}
      # How long the entrypoint waits for the env host before giving up: attempts × (5 s keyscan + 2 s sleep).
      MASON_ENV_WAIT_ATTEMPTS: ${MASON_ENV_WAIT_ATTEMPTS:-30}
      # The dated memory log is `agent/log/YYYY-MM-DD.md` in the server's local time, so the container's zone is the reader's.
      TZ: ${TZ:-UTC}
      # Model egress through the proxy sidecar, empty by default: a host that reaches its provider directly needs none of
      # this, and that is most of them. Set `HTTPS_PROXY=http://vpn:1080` in `deploy/.env` on a host where the direct route
      # is filtered and every generation ends `Request timed out`. The boot prints one `[egress]` line naming the proxy,
      # and nothing at all when these are empty.
      #
      # `NO_PROXY` is not optional once one of them is set: the integrations mason calls by name (an MCP endpoint, the
      # transcriber) are not reachable through the sidecar, and an unlisted name is a call that goes out and never comes
      # back. The default covers the names this repository ships; a deployment that adds an integration adds its service
      # name here too.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,mason,mason-env,mason-telegram,mason-asr}
    volumes:
      # The server's own state: soul, config, integrations, the database, the SSH key, the copied credential.
      - mason-service:/home/mason/.mason/service
      # The agent's half, shared with mason-env at the same path. Writable here because the server reads it through the
      # execution environment and writes the profile's first-run defaults — but the boundary that matters is that
      # mason-env cannot see `service/`, not that the server cannot see `agent/`.
      - mason-agent:/home/mason/.mason/agent
      # Writable here only: this is where the public half of the env key is written.
      - env-keys:/run/env-keys
      - type: bind
        # The operator's directory: settings.json (which model) and auth.json (which key). Read-only, and copied on
        # every boot into the home volume, because pi cannot read credentials out of a directory it cannot lock.
        source: ${MASON_PI_AGENT_DIR:?set MASON_PI_AGENT_DIR in .env to the directory holding pi's settings.json and auth.json}
        target: /run/pi-agent
        read_only: true
      - type: bind
        # The bot's own files, authored by the operator: `soul.md` — the prompt's first section, the bot's job and
        # voice — and `skills/<name>/SKILL.md`, a starter kit for this bot. A directory and not a file, because a bind
        # of a missing file is a container that will not start, and a deployment with no soul of its own (the default
        # ship's a DEFAULT_SOUL) is a legitimate one. Both are installed once and never overwritten: a soul is written
        # by a person, and the bot rewrites its own skills from then on.
        source: ${MASON_BOT_DIR:-./soul}
        target: /run/bot
        read_only: true
      - type: bind
        # The integrations the operator wrote, copied on every boot into $MASON_HOME/service/integrations.json. Create
        # it beside this file before the first `up` (an empty `{"integrations": {}}` is a stack with no integration at
        # all): a source that does not exist is a directory to the runtime, which the entrypoint reads as no input. It
        # has to be readable by uid ${MASON_UID:-1000}, the account the server runs as.
        source: ${MASON_INTEGRATIONS_FILE:-./integrations.json}
        target: /run/integrations.json
        read_only: true
    healthcheck:
      # /api/health needs no credential: a monitor that needs a token is a monitor nobody runs. The only other ways past
      # the token gate are the connector's own — /api/connector and its attachment endpoint — and those are the connector's
      # credential, not a person's.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      # The boot includes the wait for mason-env and the first mint of a pairing token; three minutes is generous on
      # purpose, because a healthcheck that fires during a legitimate first boot turns a slow start into a restart loop.
      start_period: 180s
      retries: 3

  # mason-asr: mason's own speech-to-text (`asr/`). One POST in, one JSON body out; the model is ~1.3 GB of ONNX
  # graphs and the decoder is ffmpeg. It is a container rather than a thread in mason for the same reason mason-env is:
  # a gigabyte of weights, a codec library and a restart cycle of its own, and nothing of the agent stack imports it
  # (`asr/README.md` is the whole contract). Not an integration: an integration is somebody else's image, and this is
  # ours. A stack that runs no relay never calls it, and pays for one idle container.
  mason-asr:
    # Built from `asr/` and tagged with the stack's own name like the other two mason images, so a second stack on the
    # host builds and runs its own instead of repointing this one's tag.
    build:
      context: ../asr
    image: ${MASON_STACK:-mason}-asr:local
    restart: unless-stopped
    environment:
      # The model volume's mount point. Empty on a fresh stack, and the entrypoint fetches the export from Hugging Face
      # once before the port opens; a fetch that fails exits non-zero rather than serving with no model behind it.
      ASR_MODEL_DIR: /models
      # fp16 encoder + int8 decoder: the pair a workstation's `asr/models/` holds and the pair the measured 0.07 RTF
      # was taken with. The volume has to hold what these name — set both, and the entrypoint fetches that pair.
      ASR_ENCODER: ${ASR_ENCODER:-fp16}
      ASR_DECODER: ${ASR_DECODER:-int8}
    networks:
      # In: the containers that transcribe, by name — `http://mason-asr:8100/transcribe`, which is what
      # TELEGRAM_ASR_URL in deploy/.env names. `internal: true` and no published port is the same access policy every
      # endpoint on mason-mcp gets: reachable by name from a member, unreachable from the host and from outside.
      # mason-env is not a member of this network and must not become one — a tool that could post a file it can read
      # to a transcriber is a tool with a capability its operator never registered.
      - mason-mcp
      # Out: the first boot's model fetch, and the only request this container ever makes — a public read from Hugging
      # Face, on a bridge with a gateway. `mason-out` rather than `mason-edge`, for the reason written on `mason-env`
      # above: a transcriber holds what a person said, and an integration with a reachable upstream shares `mason-edge`.
      # A deployment that seeds the volume by hand (deploy/README.md, "The transcription service") can drop this line and
      # keep the service with no route out at all.
      - mason-out
    volumes:
      # The weights: fetched once, read on every boot, and not worth backing up.
      - asr-models:/models
    healthcheck:
      # /health answers with the provider and the model it loaded, and needs no credential. The boot spends 5–15 s
      # loading the encoder, and the first one fetches 1.3 GB before that, so the start period covers a model load
      # rather than a listen — a healthcheck that fires during it would turn a slow first boot into a restart loop.
      test:
        - CMD-SHELL
        - python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3

  # An integration: one more container for a system mason should reach without a rebuild — GitHub, a docs server, an
  # internal API (docs/adr/0003-integrations-are-services.md). Nothing in this repo changes for it: no image, no
  # TypeScript, no extension. Copy the block below, uncomment it, and give it the integration's own name and image; the
  # service name is the host `integrations.json` points at.
  #
  # mason-example:
  #   # Their image, not ours: an integration is a service somebody else maintains, and it carries its own updates,
  #   # healthcheck and language.
  #   image: ghcr.io/example/mcp-example:latest
  #   restart: unless-stopped
  #   environment:
  #     # The upstream credential belongs to the container that uses it (ADR-0003), so it lives in deploy/.env beside
  #     # this file and in this container's environment — never in `service/`, never in an image. mason holds the URL and
  #     # a description, nothing that can authenticate as anybody.
  #     EXAMPLE_TOKEN: ${EXAMPLE_TOKEN:?set EXAMPLE_TOKEN in deploy/.env}
  #   networks:
  #     # In: mason reaches its MCP endpoint by name here — http://mason-example:8082/mcp, the `tools.url` in
  #     # integrations.json. No other container on mason-mcp can reach it, and mason-env is not on this network.
  #     - mason-mcp
  #     # Out: mason-edge is the only way out to the third party's API. Leave it out and the integration can be reached
  #     # by mason and can reach nothing.
  #     - mason-edge
  #   # No `ports`, here or on any integration: the container is reached by name on mason-mcp, and a published port
  #   # would be a second door into a service that holds a credential, with no token of mason's in front of it.
  #   #
  #   # No `mason-service` volume, and no `mason-agent` volume either: an integration keeps its own state or none, and
  #   # what it must never be able to read is the home.


volumes:
  # The agent: profile.md, log/, journal/, skills/, agents/, workspace/ and the repository that holds its memory.
  # Mounted into both containers at /home/mason/.mason/agent. Back this up.
  mason-agent:
    name: ${MASON_STACK:-mason}-agent
  # The service: soul.md, config.json (the token hashes and the connector credentials), integrations.json (the
  # services and their grants), data/agent.sqlite, ssh/ (the env key) and pi/ (the copied provider credential). Mounted only into the mason
  # container. Back this up too, encrypted: it holds the provider key.
  mason-service:
    name: ${MASON_STACK:-mason}-service
  # One file, written by mason and read by mason-env's sshd: the public half of the key that lets mason in.
  #
  # Named from MASON_STACK like every other volume, because two stacks sharing this one do not merely share a file: the
  # second boot overwrites the key the first one's sshd is holding, and the first stack's tool machine starts refusing
  # logins. `MASON_ENV_KEYS_VOLUME` is the escape hatch for a host that predates the prefix — the first stack here ran
  # as `env-keys`, so its own `deploy/.env` pins that name and nothing has to migrate.
  env-keys:
    name: ${MASON_ENV_KEYS_VOLUME:-${MASON_STACK:-mason}-env-keys}
  # The ASR weights (~1.3 GB of ONNX graphs): fetched once by the container, read back on every boot, and re-fetchable
  # from Hugging Face, which is why it is not in "What to back up". Prefixed by MASON_STACK like every other volume, so
  # a second bot on the same host gets its own copy from this file unchanged — one shared volume would tie two stacks'
  # precisions together, and a re-fetch for one would interrupt the other.
  asr-models:
    name: ${MASON_STACK:-mason}-asr-models
  # The files chat messages carried: written by an integration (`mason-telegram`), read by the tool machine at the same
  # path. A volume of its own rather than a corner of `mason-agent`, because what an integration may write is exactly one
  # directory of the agent's home — the profile, the log, the skills and the memory repository are not a relay's to read
  # — and because everything here is disposable: a file nothing claimed is swept after a week, while the rest of the home
  # is the agent's to keep. Nothing here is a credential, and nothing here needs backing up.
  mason-inbox:
    name: ${MASON_STACK:-mason}-inbox

networks:
  # Default bridge: outbound only in practice, since the server is the only member and it is a server.
  #
  # It carries a gateway, so being on it is a route out — which is why an integration that must reach the internet
  # through a proxy does not join it, and joins mason-egress instead.
  mason-edge:
  # `internal: true` is the inbound half of the env machine's network policy: no gateway of its own, no DNS beyond the
  # compose network, so nothing outside can reach the sshd and the tool session cannot answer a call it never got. The
  # outbound half is a second network, `mason-out` on the `mason-env` service above: a fence a deployment leaves on for
  # a stack that runs no untrusted command, and turns off for a worker on a repository.
  mason-internal:
    internal: true
  # The integration containers, mason, and the transcriber. `internal: true` plus no published port is the whole access
  # policy: an MCP server on this network is reachable by name from mason, and unreachable from the host, from another
  # machine and from the internet.
  #
  # mason-env must never join it. A tool machine that can reach an MCP server directly reaches a capability its operator
  # never approved — the tool surface is decided in mason, at boot, out of integrations.json, and a `bash` that could
  # curl the same endpoint would make that decision advisory. The missing membership is what makes it a decision.
  mason-mcp:
    internal: true
  # The outbound half of mason's own containers, and the only bridge an integration is never on: `mason-env` and
  # `mason-asr` each need the internet, and neither is a thing somebody else's image should be able to reach. An
  # ordinary bridge, so it carries a gateway; a network of its own, so a member of `mason-edge` cannot open a socket to
  # the sshd or the transcriber just by being in the same project.
  mason-out:
  # The proxy's own network, and the whole of one integration's route out: `internal: true`, so there is no gateway and
  # no direct route to anything, and the only reachable address on it is the `vpn` sidecar's mixed inbound at
  # `http://vpn:1080`. An integration that needs a proxy joins this instead of mason-edge, and only that proxy's own
  # container is on both, so this network is the integration's one way out. mason is a member too, because a host can
  # filter the provider the way it filters Telegram and the server then needs the same proxy (see its `HTTPS_PROXY`);
  # mason-env is not, and must not be: its own route out is `mason-out`, which no integration is on, and the tool machine
  # has no business reaching a proxy the server was given as an exception.
  #
  # A direct `mason-edge` membership beside this one would defeat it: mason-edge is an ordinary bridge with a gateway, so
  # the container would have its own way out to the internet and the proxy would be decoration.
  mason-egress:
    internal: true
